name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap update android
          fi

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Enable camera access
        run: |
          mkdir -p android/app/src/main/java/com/ddms/ratio
          cp android-patches/MainActivity.java android/app/src/main/java/com/ddms/ratio/MainActivity.java
          cp android-patches/EmbeddedSyncServer.java android/app/src/main/java/com/ddms/ratio/EmbeddedSyncServer.java
          python3 android-patches/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ddms-ratio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
